<style>
/* Layout: полноэкранный опрос, один вопрос на экран, плитки с логотипами сервисов; язык по браузеру */
:root {
  --bg: #F2F1EC; --surface: #FFFFFF; --fg: #0F1B2D; --muted: #5B6575;
  --line: #D9D7CF; --accent: #0F1B2D; --accent-ink: #F2F1EC; --signal: #B07A2A; --sel: #ECE6D8;
  --brass: #B07A2A;
  --f-display: "Onest", system-ui, sans-serif;
  --f-body: "Onest", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0C141F; --surface: #142030; --fg: #E9EAE6; --muted: #9AA3B2;
  --line: #253246; --accent: #E9EAE6; --accent-ink: #0C141F; --signal: #D6A24E; --sel: #1F2C3F;
  --brass: #D6A24E;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0C141F; --surface: #142030; --fg: #E9EAE6; --muted: #9AA3B2;
  --line: #253246; --accent: #E9EAE6; --accent-ink: #0C141F; --signal: #D6A24E; --sel: #1F2C3F;
  --brass: #D6A24E;
  color-scheme: dark }

* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font: 17px/1.5 var(--f-body); }
.app { min-height: 100%; display: grid; grid-template-rows: auto 1fr auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px 20px; }
.top { display: flex; align-items: center; gap: 14px; max-width: 720px; width: 100%; margin: 0 auto; min-height: 40px; }
.back { font: inherit; background: none; border: 0; color: var(--muted); cursor: pointer; padding: 8px 4px; }
.back[disabled] { visibility: hidden; }
.bar { flex: 1; height: 4px; background: var(--line); border-radius: 4px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .25s; }
.count { font: 13px var(--f-mono); color: var(--muted); min-width: 34px; text-align: right; }
.stage { display: grid; align-content: center; max-width: 720px; width: 100%; margin: 0 auto; padding-block: 24px; gap: 26px; }
h1, h2 { font-family: var(--f-display); text-wrap: balance; margin: 0; line-height: 1.15; }
h1 { font-size: clamp(30px, 6.5vw, 52px); font-weight: 700; letter-spacing: -0.01em; }
h2 { font-size: clamp(22px, 4.5vw, 32px); font-weight: 500; }
.sub { color: var(--muted); font-size: 18px; margin: 0; }
.hint { color: var(--muted); font-size: 14px; margin: -14px 0 0; }
.logos { display: flex; flex-wrap: wrap; gap: 10px; }
.logos svg { width: 30px; height: 30px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.tile { font: inherit; color: var(--fg); background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px;
  padding: 16px 14px; display: flex; align-items: center; gap: 12px; cursor: pointer; text-align: left; min-width: 0; }
.tile:hover { border-color: var(--muted); }
.tile[aria-pressed="true"] { border-color: var(--accent); background: var(--sel); }
.tile svg, .mono { width: 26px; height: 26px; flex: none; }
.mono { display: grid; place-items: center; border-radius: 7px; color: #fff; font: 700 13px var(--f-body); font-style: normal; }
.tile span { min-width: 0; overflow-wrap: anywhere; }
.tiles.text .tile { padding: 18px 16px; }
.group { display: grid; gap: 10px; }
.group b { font-weight: 600; }
.btn { font: 600 17px var(--f-body); background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 10px;
  padding: 15px 26px; cursor: pointer; text-decoration: none; display: inline-block; justify-self: start; }
.btn[aria-disabled="true"] { opacity: .45; pointer-events: none; }
button:focus-visible, a:focus-visible, input:focus-visible { outline: 3px solid var(--signal); outline-offset: 3px; }
textarea.extra { max-width: 100%; resize: vertical; font-size: 17px; }
input.name, textarea.name { font: inherit; font-size: 20px; padding: 14px 16px; border: 1.5px solid var(--line); border-radius: 10px;
  background: var(--surface); color: var(--fg); width: 100%; max-width: 420px; }
.facts { display: flex; flex-wrap: wrap; gap: 8px 22px; font: 14px var(--f-mono); color: var(--muted); }
.facts b { color: var(--fg); font-weight: 500; }
.msg { white-space: pre-wrap; font: 14px/1.6 var(--f-mono); background: var(--surface); border: 1px solid var(--line);
  border-radius: 10px; padding: 14px; overflow-x: auto; margin: 0; }
.ok { color: var(--accent); font-weight: 600; }
.brand { display: flex; align-items: center; gap: 10px; font: 650 22px var(--f-display); letter-spacing: -0.01em; }
.brand svg { width: 30px; height: 30px; }
ol.steps { list-style: none; margin: 0; padding: 0; counter-reset: s; display: grid; }
ol.steps li { counter-increment: s; display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 2px 12px;
  padding: 14px 0; border-top: 1px solid var(--line); }
ol.steps li:last-child { border-bottom: 1px solid var(--line); }
ol.steps li::before { content: counter(s); grid-row: span 2; font: 700 20px/1.2 var(--f-display); color: var(--accent); }
ol.steps span { color: var(--muted); font-size: 16px; }
.prices { display: grid; gap: 8px; }
.prices div { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 12px; align-items: baseline; }
.prices b { font: 600 18px var(--f-display); font-variant-numeric: tabular-nums; }
.prices span { color: var(--muted); font-size: 15px; }
p.about { color: var(--fg); font-size: 17px; max-width: 62ch; }
.links { margin-top: -10px; }
@media (max-width: 480px) { .prices div { grid-template-columns: minmax(0, 1fr); gap: 0; } }
.cta-row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; }
.mail { font-family: var(--f-mono); font-weight: 500; color: var(--fg); user-select: all; overflow-wrap: anywhere; }
.foot { max-width: 720px; width: 100%; margin: 0 auto; font-size: 13px; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <button class="back" id="back" type="button" disabled></button>
    <div class="bar"><i id="prog"></i></div>
    <div class="count" id="count"></div>
  </div>
  <main class="stage" id="stage" aria-live="polite"></main>
  <div class="foot" id="foot"></div>
</div>

    return '<i class="mono" style="background:' + m[1] + '" aria-hidden="true">' + m[0] + '</i>';
  }
  var st = { mail: [], tasks: [], more: [], goals: [], plan: [], os: [], sub: [], name: "", extra: "" };
  function has(k, v) { return st[k].indexOf(v) >= 0; }
  // варианты «в первую очередь» зависят от ответов выше: нет Telegram — нет и разбора Telegram
  var GOALS = [
    ["g-mail", function () { return st.mail.length > 0; }],
    ["g-tasks", function () { return st.tasks.length > 0 && !has("tasks", "none"); }],
    ["g-newtasks", function () { return has("tasks", "none"); }],
    ["g-tg", function () { return has("more", "telegram"); }],
    ["g-li", function () { return has("more", "linkedin"); }],
    ["g-drive", function () { return has("more", "googledrive"); }],
    ["g-cal", function () { return has("more", "googlecalendar"); }],
    ["g-human", function () { return true; }],
    ["g-week", function () { return true; }]
  ];
  var STEPS = [
    { id: "intro" },
    { id: "mail", q: "qMail", hint: "several", multi: true,
      opts: ["gmail", "outlook", "yandex", "maildotru", "icloud", "other"] },
    { id: "tasks", q: "qTasks", hint: "several", multi: true,
      opts: ["ticktick", "todoist", "notion", "trello", "asana", "clickup", "googletasks", "mstodo", "planfix", "none"] },
    { id: "more", q: "qMore", hint: "severalOrNone", multi: true,
      opts: ["telegram", "linkedin", "googledrive", "googlecalendar"] },
    { id: "goals", q: "qGoals", hint: "goalsHint", multi: true, text: true,
      opts: function () { return GOALS.filter(function (g) { return g[1](); }).map(function (g) { return g[0]; }); } },
    { id: "plan", q: "qPlan", text: true, opts: ["p1", "p2", "p3"] },
    { id: "extra", q: "qExtra", hint: "extraHint" },
    { id: "setup", q: "qSetup", groups: [
      { id: "os", label: "os", opts: ["windows", "apple"] },
      { id: "sub", label: "sub2", text: true, opts: ["sub-yes", "sub-no"] }] },
    { id: "name", q: "qName" },
    { id: "done" }
  ];
  var i = 0;
  var stage = document.getElementById("stage");

  function toggle(k, v, multi) {
    if (!multi) { st[k] = has(k, v) ? [] : [v]; return; }
    if (v === "none") { st[k] = has(k, v) ? [] : ["none"]; return; }
    st[k] = st[k].filter(function (x) { return x !== "none"; });
    st[k] = has(k, v) ? st[k].filter(function (x) { return x !== v; }) : st[k].concat(v);
  }
  function tiles(key, opts, multi, text) {
    return '<div class="tiles' + (text ? " text" : "") + '" role="group">' + opts.map(function (o) {
      return '<button type="button" class="tile" data-k="' + key + '" data-v="' + o + '" data-m="' + (multi ? 1 : 0) +
        '" aria-pressed="' + has(key, o) + '">' + (text ? "" : icon(o)) + '<span>' + label(o) + '</span></button>';
    }).join("") + '</div>';
  }
  function canGo() {
    var s = STEPS[i];
    if (s.id === "mail" || s.id === "tasks" || s.id === "goals" || s.id === "plan") return st[s.id].length > 0;
    if (s.id === "setup") return st.os.length > 0 && st.sub.length > 0;
    return true;
  }
  function names(k) { return st[k].map(label); }
  function packs() {
    var p = ["naladka"], custom = [], m = t("m");
    var gmail = has("mail", "gmail");
    if (gmail || has("more", "googledrive") || has("more", "googlecalendar") || has("tasks", "googletasks")) p.push("google");
    if (gmail && has("goals", "g-mail")) p.push("inbox");
    if (has("more", "telegram")) { p.push("telegram"); if (has("goals", "g-tg")) p.push("tg-inbox"); }
    st.mail.forEach(function (v) { if (v !== "gmail") custom.push(label(v)); });
    st.tasks.forEach(function (v) { if (v !== "none") custom.push(label(v)); });
    if (has("more", "linkedin")) custom.push("LinkedIn");
    if (has("goals", "g-human")) custom.push("humanizer");
    if (has("goals", "g-week")) custom.push(m.week);
    if (has("goals", "g-newtasks")) custom.push(m.newtasks);
    return { p: p, custom: custom };
  }
  function message() {
    var k = packs(), m = t("m"), L = [m.hello];
    if (st.name) L.push(m.name + ": " + st.name);
    L.push(m.mail + ": " + names("mail").join(", "));
    L.push(m.tasks + ": " + names("tasks").join(", "));
    if (st.more.length) L.push(m.more + ": " + names("more").join(", "));
    L.push(m.goals + ": " + names("goals").join(", "));
    L.push(m.plan + ": " + names("plan").join(""));
    if (st.extra) L.push(m.extra + ": " + st.extra);
    L.push(m.pc + ": " + names("os").join("") + ", " + m.sub + ": " + names("sub").join(""));
    L.push("", "#lang " + lang, "#pack " + k.p.join(" "));
    if (k.custom.length) L.push("#custom " + k.custom.join(", "));
    return L.join("\n");
  }
  function esc(x) { return String(x).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function chrome() {
    var n = STEPS.length - 1;
    document.documentElement.lang = lang;
    document.title = t("title");
    document.getElementById("back").textContent = t("back");
    document.getElementById("back").disabled = i === 0;
    document.getElementById("prog").style.width = Math.round(i / n * 100) + "%";
    document.getElementById("count").textContent = i > 0 && i < n ? i + "/" + (n - 1) : "";
    document.getElementById("foot").textContent = t("foot");
  }
  var view = "";   // "" — опрос; "free" | "how" | "about" — отдельные экраны с первого
  function startBtn() {
    var b = document.getElementById("go");
    if (b) b.onclick = function () { view = ""; i = 1; render(); };
  }
  function render() {
    var s = STEPS[i], h = "";
    chrome();
    if (view === "how") {
      document.getElementById("back").disabled = false;
      stage.innerHTML = '<h2>' + t("howH") + '</h2><ol class="steps">' + t("howSteps").map(function (x) {
          return '<li><b>' + x[0] + '</b><span>' + x[1] + '</span></li>'; }).join("") + '</ol>' +
        '<div class="group"><b>' + t("howWhatH") + '</b><p class="sub">' + t("howWhat") + '</p></div>' +
        '<div class="group"><b>' + t("howSafeH") + '</b><p class="sub">' + t("howSafe") + '</p></div>' +
        '<div class="group"><b>' + t("howPriceH") + '</b><div class="prices">' + t("howPrices").map(function (x) {
          return '<div><b>' + x[0] + '</b><span>' + x[1] + '</span></div>'; }).join("") + '</div></div>' +
        '<button class="btn" type="button" id="go">' + t("start") + '</button>';
      startBtn();
      return;
    }
    if (view === "about") {
      document.getElementById("back").disabled = false;
      stage.innerHTML = '<h2>' + t("aboutH") + '</h2>' + t("about").map(function (x) {
          return '<p class="sub about">' + x + '</p>'; }).join("") +
        '<button class="btn" type="button" id="go">' + t("start") + '</button>';
      startBtn();
      return;
    }
    if (view === "free") {
      document.getElementById("back").disabled = false;
      stage.innerHTML = '<h2>' + t("freeH") + '</h2><p class="sub">' + t("freeSub") + '</p>' +
        '<a class="btn" target="_blank" rel="noopener" href="https://t.me/dzubaart?text=' + encodeURIComponent(t("freeMsg")) + '">' + t("freeBtn") + '</a>' +
        '<p class="sub" style="font-size:16px">' + t("orEmail") + ' <b class="mail">dzubaart1@gmail.com</b></p>';
      return;
    }
    if (s.id === "intro") {
      stage.innerHTML = '<div class="brand"><svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="25" fill="none" stroke="currentColor" stroke-width="5"/><rect x="30" y="3" width="4" height="8" rx="2" fill="var(--brass)"/><path d="M32 32 L47.5 16.5 L41 34 Z" fill="var(--brass)"/><path d="M32 32 L16.5 47.5 L23 30 Z" fill="currentColor"/><circle cx="32" cy="32" r="4" fill="currentColor"/></svg>steerwell</div><h1>' + t("h1") + '</h1><p class="sub">' + t("sub") + '</p>' +
        '<div class="logos">' + ["gmail", "telegram", "notion", "todoist", "ticktick", "googledrive", "linkedin", "trello"].map(icon).join("") + '</div>' +
        '<div class="facts">' + t("facts").map(function (f) { return '<span><b>' + f[0] + '</b> ' + f[1] + '</span>'; }).join("") + '</div>' +
        '<div class="cta-row"><button class="btn" type="button" id="next">' + t("start") + '</button>' +
        '<button class="back" type="button" id="free">' + t("free") + ' →</button></div>' +
        '<div class="cta-row links"><button class="back" type="button" id="how">' + t("howLink") + '</button>' +
        '<button class="back" type="button" id="about">' + t("aboutLink") + '</button></div>';
      document.getElementById("next").onclick = next;
      document.getElementById("free").onclick = function () { view = "free"; render(); };
      document.getElementById("how").onclick = function () { view = "how"; render(); };
      document.getElementById("about").onclick = function () { view = "about"; render(); };
      return;
    }
    if (s.id === "done") {
      var msg = message();
      stage.innerHTML = '<h2>' + t("done") + ', ' + (st.name ? esc(st.name) : t("thanks")) + '!</h2>' +
        '<p class="sub">' + t("doneSub") + '</p><pre class="msg" id="msg"></pre>' +
        '<a class="btn" id="send" target="_blank" rel="noopener" href="https://t.me/dzubaart?text=' + encodeURIComponent(msg) + '">' + t("send") + '</a>' +
        '<p class="hint" id="hint" style="margin:0">' + t("sendHint") + '</p>' +
        '<p class="sub" style="font-size:16px">' + t("orEmail") + ' <b class="mail">dzubaart1@gmail.com</b> ' +
        '<button type="button" class="back" id="copymail">' + t("copyEmail") + '</button></p>';
      document.getElementById("msg").textContent = msg;
      document.getElementById("send").addEventListener("click", function () { copy(msg); });
      document.getElementById("copymail").addEventListener("click", function (e) {
        var b = e.currentTarget;
        try { navigator.clipboard.writeText("dzubaart1@gmail.com").then(function () { b.textContent = t("emailCopied"); }, function () {}); }
        catch (err) { /* адрес виден текстом, его можно выделить */ }
      });
      return;
    }
    if (s.id === "goals") {
      var ok = s.opts();
      st.goals = st.goals.filter(function (v) { return ok.indexOf(v) >= 0; });
    }
    h = '<h2>' + t(s.q) + '</h2>' + (s.hint ? '<p class="hint">' + t(s.hint) + '</p>' : "");
    if (s.opts) h += tiles(s.id, typeof s.opts === "function" ? s.opts() : s.opts, s.multi, s.text);
    if (s.groups) h += s.groups.map(function (g) {
      return '<div class="group"><b>' + t(g.label) + '</b>' + tiles(g.id, g.opts, false, g.text) + '</div>';
    }).join("");
    if (s.id === "extra") h += '<textarea class="name extra" id="extra" rows="4" placeholder="' + t("extraPh") + '">' + esc(st.extra) + '</textarea>';
    if (s.id === "name") h += '<input class="name" id="name" autocomplete="given-name" placeholder="' + t("namePh") + '" value="' + esc(st.name) + '">';
    h += '<button class="btn" type="button" id="next" aria-disabled="' + !canGo() + '">' + t("next") + '</button>';
    stage.innerHTML = h;
    var ex = document.getElementById("extra");
    if (ex) { ex.focus(); ex.oninput = function () { st.extra = ex.value.trim(); }; }
    var nm = document.getElementById("name");
    if (nm) {
      nm.focus();
      nm.oninput = function () { st.name = nm.value.trim(); };
      nm.onkeydown = function (e) { if (e.key === "Enter") next(); };
    }
    document.getElementById("next").onclick = next;
  }
  function next() { if (canGo() && i < STEPS.length - 1) { i++; render(); } }
  function copy(msg) {
    var hint = document.getElementById("hint");
    function sel() {
      var r = document.createRange(); r.selectNodeContents(document.getElementById("msg"));
      var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
      hint.textContent = t("selected");
    }
    try {
      navigator.clipboard.writeText(msg).then(function () {
        hint.innerHTML = '<span class="ok">' + t("copied") + '</span>' + t("copiedTail");
      }, sel);
    } catch (e) { sel(); }
  }
  stage.addEventListener("click", function (e) {
    var b = e.target.closest(".tile");
    if (!b) return;
    toggle(b.dataset.k, b.dataset.v, b.dataset.m === "1");
    b.parentNode.querySelectorAll(".tile").forEach(function (x) { x.setAttribute("aria-pressed", has(x.dataset.k, x.dataset.v)); });
    document.getElementById("next").setAttribute("aria-disabled", !canGo());
  });
  document.getElementById("back").onclick = function () {
    if (view) { view = ""; render(); } else if (i > 0) { i--; render(); }
  };
  render();
})();
</script>
